name: Update profile images

on:
  schedule:
    - cron: '17 5 * * *' # every day, 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'sprites/**', '.github/workflows/update.yml']

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate SVGs
        run: node scripts/generate.mjs
        env:
          # Add a PROFILE_TOKEN secret (personal access token) to count private contributions too.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Update profile images"
          git push
